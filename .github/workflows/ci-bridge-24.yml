name: Bridge #24 CI
on:
  pull_request:
    paths:
      - 'src/rviz_mcp/rviz2_bridge.py'
      - 'src/rviz_mcp/backend/live.py'
      - 'tests/test_rviz2_bridge.py'
      - 'tests/test_live_backend_contract.py'
      - 'docs/rviz2-bridge.md'
permissions:
  contents: read
jobs:
  bridge-tests:
    name: Bridge contract and mock tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest tests/test_rviz2_bridge.py tests/test_live_backend_contract.py -v
